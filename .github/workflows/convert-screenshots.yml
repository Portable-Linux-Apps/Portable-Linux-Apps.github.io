name: Convert screenshots to AVIF

# The pla-shots worker serves kazam0180/linux-app-shots, so a screenshot has to
# exist there before an app file may point at it. This workflow republishes the
# screenshots that still need converting, confirms the worker serves them, and
# then points the app files at it.
#
# Both changes land as pull requests rather than direct commits, one per repo.
# The worker serves the shots repository's default branch, so the screenshots
# only go live when that pull request is merged: merge the linux-app-shots pull
# request first, then the site's. Until then the worker check below reports the
# unserved URLs as a warning instead of failing the run.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: convert-screenshots
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.com/kazam0180/pla-site-tool:latest
    steps:
      - name: Checkout the site
        uses: actions/checkout@v7
        with:
          path: site

      - name: Checkout linux-app-shots
        uses: actions/checkout@v7
        with:
          repository: kazam0180/linux-app-shots
          path: shots
          token: ${{ secrets.PLA_SHOTS_TOKEN }}

      - name: Convert the screenshots
        working-directory: site
        run: |
          set -e
          # --shots-dir turns on sync mode: worker URLs in the app files are
          # resolved through the manifest committed in linux-app-shots, their
          # originals are re-fetched (ETag first, then a content hash), and
          # the changed ones are re-converted into .cache. The manifest in
          # the shots checkout is updated and pruned of entries no app file
          # references anymore, and the shots-relative paths of what changed
          # and what to delete are left in .cache/screenshots/changed.txt
          # and pruned.txt.
          imgtool -p . --shots-dir ../shots app-screenshots

      - name: Prune deleted screenshots
        working-directory: site
        run: |
          set -e
          # A published copy whose references are gone — its screenshot
          # removed from the app file, or its app gone — is deleted here so
          # the pull request stages the removal: imgtool lists the orphans
          # in pruned.txt and never touches this checkout's screenshots
          # itself. Copies whose app file was reverted to the original URL
          # are not in the list; the run republishes through their record.
          [ -s .cache/screenshots/pruned.txt ] || { echo "No prunes: the pruned list is empty."; exit 0; }
          while read -r rel; do
            [ -n "$rel" ] || continue
            if [ -f "../shots/$rel" ]; then
              rm "../shots/$rel"
              echo "pruned $rel"
            else
              echo "$rel was already gone"
            fi
          done < .cache/screenshots/pruned.txt

      - name: Publish the converted screenshots
        working-directory: site
        run: |
          set -e
          # imgtool converts and records; publishing stays here. changed.txt
          # carries the shots-relative paths of everything republished this
          # run, and each is copied from the conversion cache into the shots
          # checkout, where the pull request carries it beside the manifest.
          [ -s .cache/screenshots/changed.txt ] || { echo "Nothing to publish: the changed list is empty."; exit 0; }
          while read -r rel; do
            [ -n "$rel" ] || continue
            src=".cache/screenshots/avif/$(basename "$rel" .avif).avif"
            if [ ! -f "$src" ]; then
              echo "::warning::$rel changed but has no converted file"
              continue
            fi
            mkdir -p "../shots/$(dirname "$rel")"
            cp "$src" "../shots/$rel"
          done < .cache/screenshots/changed.txt

      - name: Open the linux-app-shots pull request
        working-directory: shots
        env:
          GH_TOKEN: ${{ secrets.PLA_SHOTS_TOKEN }}
        run: |
          set -e
          # The publish step has copied the changed AVIFs into this checkout,
          # the prune step has deleted the copies whose references are gone,
          # and imgtool has updated manifest.json — one commit carries
          # records, their bytes and their removals together. Stage exactly
          # that instead of `git add -A`, which would sweep in any unrelated
          # change sitting in the checkout. imgtool writes both lists on
          # every sync run, empty when there is nothing to do.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          base=$(git ls-remote --symref origin HEAD | awk 'NR==1 { sub(/^refs\/heads\//, "", $2); print $2 }')
          git fetch --force origin "$base"
          # The pull-request branch is rebuilt from the default branch every
          # run, so the pull request always shows exactly this run's changes.
          # Only this workflow writes the branch — the concurrency group
          # serializes runs and nothing else touches this repo — which is
          # why the push may force.
          git checkout -B convert-screenshots "origin/$base"
          git add manifest.json
          while read -r rel; do
            [ -n "$rel" ] || continue
            git add -- "$rel" || echo "::warning::$rel changed but could not be staged"
          done < ../site/.cache/screenshots/changed.txt
          while read -r rel; do
            [ -n "$rel" ] || continue
            git add -- "$rel" || echo "::warning::$rel pruned but could not be staged"
          done < ../site/.cache/screenshots/pruned.txt
          if git diff --cached --quiet; then
            echo "Nothing new to publish: no linux-app-shots pull request this run."
            exit 0
          fi
          changed=$(wc -l < ../site/.cache/screenshots/changed.txt)
          pruned=$(wc -l < ../site/.cache/screenshots/pruned.txt)
          git commit -m "chore: sync converted screenshots ($changed changed, $pruned pruned)"
          git push --force origin convert-screenshots
          printf '{"title":"Sync converted screenshots","head":"convert-screenshots","base":"%s","body":"Automated screenshot conversion.\\n\\nMerge this before the matching Portable-Linux-Apps pull request, so the pla-shots worker serves every screenshot URL the app files reference."}' "$base" > /tmp/pull.json
          code=$(curl -sS -o /tmp/pull-reply.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/kazam0180/linux-app-shots/pulls \
            --data-binary @/tmp/pull.json)
          if [ "$code" = 201 ]; then
            echo "Opened the linux-app-shots pull request"
          elif [ "$code" = 422 ] && grep -q 'already exists' /tmp/pull-reply.json; then
            echo "Pull request already open; pushed the new commit onto it"
          else
            echo "::error::Opening the linux-app-shots pull request failed (HTTP $code)"
            cat /tmp/pull-reply.json
            exit 1
          fi

      - name: Confirm the worker serves what the app files will point at
        working-directory: site
        run: |
          set -e
          # Two sets of URLs matter: the shots this run republished
          # (changed.txt, written by imgtool), and any worker URL in the app
          # files this run is about to commit. A reference that was already
          # broken before this run is not its doing. linux-app-shots sits
          # behind Cloudflare, which can lag the push by a minute or so, so
          # an unresolved URL is retried before it is reported.
          #
          # Both changes land on pull request branches this run, and the
          # worker serves the shots repository's default branch, so the new
          # screenshots stay unserved until the shots pull request is
          # merged. This check is therefore advisory: a miss is a warning on
          # the run, not a failure. Merge the shots pull request first.
          : > /tmp/toverify.txt
          if [ -f .cache/screenshots/changed.txt ]; then
            sed 's#^#https://pla-shots.mrcreamy112233.workers.dev/#' \
              .cache/screenshots/changed.txt >> /tmp/toverify.txt || true
          fi
          git diff --name-only apps/ > /tmp/changed-apps.txt || true
          while read -r f; do
            [ -n "$f" ] || continue
            grep -hoE 'https://pla-shots\.mrcreamy112233\.workers\.dev/[^[:space:]]+\.avif' "$f" 2>/dev/null \
              | sed 's#^https://pla-shots\.mrcreamy112233\.workers\.dev/##' >> /tmp/toverify.txt || true
          done < /tmp/changed-apps.txt
          sort -u /tmp/toverify.txt -o /tmp/toverify.txt

          if [ ! -s /tmp/toverify.txt ]; then
            echo "Nothing to confirm: no changed shots and no app file changes."
            exit 0
          fi

          cp /tmp/toverify.txt /tmp/pending.txt
          for round in 1 2 3 4 5 6; do
            [ -s /tmp/pending.txt ] || break
            : > /tmp/still.txt
            while read -r rel; do
              # Same UA imgtool sends: a Cloudflare WAF/bot rule can 403 the
              # default curl UA and fail the step spuriously.
              code=$(curl -sS \
                -A 'Mozilla/5.0 (imgtool; +https://portable-linux-apps.github.io)' \
                -o /dev/null -w '%{http_code}' \
                "https://pla-shots.mrcreamy112233.workers.dev/$rel" || true)
              [ "$code" = "200" ] || echo "$rel" >> /tmp/still.txt
            done < /tmp/pending.txt
            mv /tmp/still.txt /tmp/pending.txt
            [ -s /tmp/pending.txt ] && sleep 20
          done

          if [ -s /tmp/pending.txt ]; then
            echo "::warning::$(wc -l < /tmp/pending.txt) screenshot(s) the app files point at are not being served — expected while the linux-app-shots pull request is unmerged. Merge it first; if URLs are still missing afterwards, re-run this workflow:"
            cat /tmp/pending.txt
            exit 0
          fi
          echo "All $(wc -l < /tmp/toverify.txt) screenshot(s) confirmed on the worker"

      - name: Open the site pull request
        working-directory: site
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: https://api.github.com/repos/${{ github.repository }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/
          if git diff --cached --quiet; then
            echo "No app file changes: no site pull request this run."
            exit 0
          fi
          git commit -m "chore: point screenshots at the pla-shots worker"
          git checkout -B convert-screenshots
          base=$(git ls-remote --symref origin HEAD | awk 'NR==1 { sub(/^refs\/heads\//, "", $2); print $2 }')
          # sync-with-AM commits apps/ every 30 minutes, so the branch is
          # rebased onto the current default branch before pushing — that
          # keeps the pull request showing only this run's app-file changes.
          for attempt in 1 2 3; do
            git fetch --force origin "$base"
            if git rebase "origin/$base"; then
              break
            fi
            git rebase --abort 2>/dev/null || true
            [ "$attempt" = 3 ] && { echo "::error::Could not rebase the app files onto origin/$base"; exit 1; }
            echo "Rebase failed, retrying with a fresh fetch (attempt $attempt of 3)"
          done
          git push --force origin convert-screenshots
          printf '{"title":"Point screenshots at the pla-shots worker","head":"convert-screenshots","base":"%s","body":"Automated app-file update.\\n\\nMerge this **after** the linux-app-shots screenshots pull request has been merged, so the pla-shots worker serves every URL these app files reference."}' "$base" > /tmp/pull.json
          code=$(curl -sS -o /tmp/pull-reply.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$API_URL/pulls" \
            --data-binary @/tmp/pull.json)
          if [ "$code" = 201 ]; then
            echo "Opened the site pull request"
          elif [ "$code" = 422 ] && grep -q 'already exists' /tmp/pull-reply.json; then
            echo "Pull request already open; pushed the new commit onto it"
          else
            echo "::error::Opening the site pull request failed (HTTP $code)"
            cat /tmp/pull-reply.json
            exit 1
          fi
