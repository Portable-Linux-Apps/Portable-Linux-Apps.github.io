am_repo = "https://raw.githubusercontent.com/ivan-hc/AM/main"
archs = ["x86_64", "aarch64", "i686"]
meta_pkgs = ["kdegames", "kdeutils", "node", "platform-tools"]
out_dir = "public"
languages = ["en", "it"]

[[categories]]
name = "ai"

[categories.pattern]
include = 'chatgpt|openai|gemini|claude|copilot|perplexity| meta |grok|anthropic|huggingface|mistral|cohere|together|replicate|cursor|codeium|tabnine|replit|windsurf|midjourney|firefly|canva|runway|leonardo|synthesia|elevenlabs|heygen|zapier|z\.ai|clickup|grammarly|ollama|lmstudio|openwebui|salesforce|watsonx'
exclude = "illus"

[[categories]]
name = "am-utils"

[categories.pattern]
include = '"am-utils"'

[[categories]]
name = "android"

[categories.pattern]
include = "android|platform-tools"

[[categories]]
